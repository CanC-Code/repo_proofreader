# .github/workflows/run-analysis.yml
name: Proofreader Analysis
on:
  workflow_call:
    inputs:
      target_branch:
        required: true
        type: string
    secrets:
      OPENAI_API_KEY:
        required: true

jobs:
  analyze-and-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Proofreader Logic
        uses: actions/checkout@v4
        with:
          repository: CanC-Code/repo_proofreader
          path: .proofreader-engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r .proofreader-engine/scripts/requirements.txt

      - name: Run Diagnostic Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .proofreader-engine/scripts/main.py --repo_path=$GITHUB_WORKSPACE
