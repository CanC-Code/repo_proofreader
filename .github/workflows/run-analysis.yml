name: Proofreader Analysis Engine

on:
  workflow_call:
    inputs:
      target_branch:
        required: true
        type: string
    secrets:
      OPENAI_API_KEY:
        required: false

jobs:
  run-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Target Repository
        uses: actions/checkout@v4
        with:
          path: .
          fetch-depth: 0  

      - name: 🧠 Checkout Proofreader Engine
        uses: actions/checkout@v4
        with:
          repository: CanC-Code/repo_proofreader
          path: .proofreader-engine

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Requirements
        run: |
          pip install -r .proofreader-engine/scripts/requirements.txt
          pip install llama-cpp-python[server] --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: 🤖 Initialize Local LLM Server
        run: |
          wget -q https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/qwen2.5-coder-3b-instruct-q4_k_m.gguf -O model.gguf
          # --- FIX: Expanded context window to 16384 tokens ---
          python3 -m llama_cpp.server --model model.gguf --port 8000 --host 0.0.0.0 --n_ctx 16384 &
          sleep 15

      - name: 🚀 Run Diagnostic Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_ENDPOINT: "http://localhost:8000/v1"
        run: |
          python3 .proofreader-engine/scripts/main.py --repo_path .