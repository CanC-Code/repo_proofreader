name: Proofreader Analysis Engine

on:
  workflow_call:
    inputs:
      target_branch:
        required: true
        type: string
    secrets:
      OPENAI_API_KEY:
        required: false # Set to true if you eventually require the external API

jobs:
  run-diagnostic:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the project repository (the code being analyzed)
      - name: 📥 Checkout Target Repository
        uses: actions/checkout@v4
        with:
          path: .

      # 2. Checkout the proofreader engine repository (the scripts/logic)
      - name: 🧠 Checkout Proofreader Engine
        uses: actions/checkout@v4
        with:
          repository: CanC-Code/repo_proofreader
          path: .proofreader-engine

      # 3. Setup Python environment
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Install dependencies using the now-accessible requirements file
      - name: 📦 Install Requirements
        run: |
          pip install -r .proofreader-engine/scripts/requirements.txt
          pip install llama-cpp-python[server] --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      # 5. Execute your diagnostic script
      - name: 🚀 Run Diagnostic Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Execute the main orchestrator script and point it to the checked-out target repo
          python3 .proofreader-engine/scripts/main.py --repo_path .
